name: build
on: pull_request

jobs:
  macos-brew:
    name: macOS (brew)
    runs-on: macos-latest
    steps:
      - run: echo "Running macOS (brew)..."

  windows-msys2:
    name: Windows (MSYS2)
    runs-on: windows-latest
    steps:
      - run: echo "Running Windows (MSYS2)..."

  arch-linux:
    name: Arch Linux
    runs-on: ubuntu-latest
    steps:
      - run: echo "Running Arch Linux..."

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - run: echo "Running Docker..."

  source-archive:
    name: source archive
    runs-on: ubuntu-latest
    steps:
      - run: echo "Running source archive..."

  build-linux:
    name: ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: ['Debian 11', 'Ubuntu 22.04']
    steps:
      - run: echo "Building on ${{ matrix.os }}..."

  test-ubuntu:
    name: ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: ['Ubuntu 24.04 (tests)']
    steps:
      - run: echo "Testing on ${{ matrix.os }}..."
