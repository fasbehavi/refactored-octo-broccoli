name: "CI Pipeline"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  # 1. Version Job
  version:
    name: "version"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
      - name: "Identify version"
        run: echo "Insert version identification steps here"

  # 2. Build Job (Depends on version)
  build:
    name: "Build ${{ matrix.arch }}"
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: 
          - "amd64"
          - "arm64"
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
      - name: "Build placeholder"
        run: echo "Insert build steps for ${{ matrix.arch }} here"

  # 3. Publish Installers (Depends on build)
  publish-installers:
    name: "Publish ${{ matrix.arch }} ${{ matrix.interface }} DEB"
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: 
          - "ARM64"
          - "Intel"
        interface: 
          - "GUI"
          - "CLI"
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
      - name: "Publish placeholder"
        run: echo "Insert publishing steps for ${{ matrix.arch }} ${{ matrix.interface }} here"

  # 4. Test Job (Depends on build)
  test:
    name: "Test ${{ matrix.os }} ${{ matrix.interface }} ${{ matrix.arch }}"
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: 
          - "debian:bookworm"
          - "debian:trixie"
          - "ubuntu:jammy (22.04)"
          - "ubuntu:noble (24.04)"
        interface: 
          - "GUI"
          - "CLI"
        arch: 
          - "ARM64"
          - "Intel"
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
      - name: "Test placeholder"
        run: echo "Insert testing steps for ${{ matrix.os }} ${{ matrix.interface }} ${{ matrix.arch }} here"
